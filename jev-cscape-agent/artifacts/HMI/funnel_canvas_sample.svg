<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1200" height="750" viewBox="0 0 1200 750" style="background-color: #0F172A; font-family: Segoe UI, -apple-system, sans-serif;">
<defs>
  <filter id="funnel-glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3.5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <linearGradient id="funnel-fluid-grad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#064E3B" stop-opacity="0.85"/>
    <stop offset="50%" stop-color="#047857" stop-opacity="0.88"/>
    <stop offset="100%" stop-color="#10B981" stop-opacity="0.92"/>
  </linearGradient>
  <linearGradient id="offtake-grad-up" x1="0%" y1="100%" x2="0%" y2="0%">
    <stop offset="0%" stop-color="#047857" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.9"/>
  </linearGradient>
  <linearGradient id="offtake-grad-down" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#047857" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.9"/>
  </linearGradient>
  <marker id="arrow-up" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 10 L 5 0 L 10 10 z" fill="#F59E0B"/>
  </marker>
  <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 0 L 5 10 z" fill="#F59E0B"/>
  </marker>
</defs>
