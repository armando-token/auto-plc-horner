  <text x="50" y="44" fill="#F8FAFC" font-size="16" font-weight="bold" letter-spacing="0.5">DYNAMIC PIPELINE / FUNNEL MULTI-STAGE YIELD &amp; CONVERSION CANVAS</text>
  <text x="50" y="64" fill="#94A3B8" font-size="11">Work Package W150 | Gate G9 Graphic HMI Engine | Horner OCS %R1110..%R1117, %M259..%M260</text>
