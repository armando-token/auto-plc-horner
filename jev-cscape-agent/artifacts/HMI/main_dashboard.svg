<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" font-family="Segoe UI, Arial, sans-serif" text-rendering="geometricPrecision" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B263B" />
      <stop offset="100%" stop-color="#0D1B2A" />
    </linearGradient>
    <linearGradient id="btnBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3" />
    </linearGradient>
    <filter id="lampGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="elementShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feFlood flood-color="#000000" flood-opacity="0.35" />
      <feComposite in2="offsetblur" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Canvas Background -->
  <rect width="800" height="480" fill="#1E1E1E" />
  <!-- Alignment Grid -->
  <g stroke="#2C3E50" stroke-width="0.5" stroke-opacity="0.25">
    <line x1="40" y1="0" x2="40" y2="480" />
    <line x1="80" y1="0" x2="80" y2="480" />
    <line x1="120" y1="0" x2="120" y2="480" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="200" y1="0" x2="200" y2="480" />
    <line x1="240" y1="0" x2="240" y2="480" />
    <line x1="280" y1="0" x2="280" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="360" y1="0" x2="360" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" />
    <line x1="440" y1="0" x2="440" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="520" y1="0" x2="520" y2="480" />
    <line x1="560" y1="0" x2="560" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
    <line x1="680" y1="0" x2="680" y2="480" />
    <line x1="720" y1="0" x2="720" y2="480" />
    <line x1="760" y1="0" x2="760" y2="480" />
    <line x1="0" y1="40" x2="800" y2="40" />
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="280" x2="800" y2="280" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="440" x2="800" y2="440" />
  </g>
  <!-- Screen Title Header -->
  <rect x="0" y="0" width="800" height="40" fill="url(#headerGrad)" />
  <line x1="0" y1="40" x2="800" y2="40" stroke="#415A77" stroke-width="1.5" />
  <text x="20" y="25" fill="#E0E1DD" font-size="16" font-weight="bold">Main Process Dashboard</text>
  <text x="780" y="25" fill="#778DA9" font-size="12" text-anchor="end">Screen ID: 1 | Res: 800x480</text>
  <!-- Screen Graphical Elements -->
  <g id="alarm_banner_1" filter="url(#elementShadow)"><rect x="10" y="44" width="780" height="24" rx="4" fill="#2C3E50" stroke="#E74C3C" stroke-width="0.5" /><circle cx="28" cy="56.0" r="6" fill="#2ECC71" /><text x="42" y="60.0" fill="#FFFFFF" font-size="11" font-weight="bold">SYSTEM NORMAL - NO ACTIVE ALARMS</text></g>
  <g id="tank1_level_bargraph" filter="url(#elementShadow)"><text x="40" y="66" fill="#A0AAB2" font-size="11" font-weight="600">Tank 1 Level</text><rect x="40" y="70" width="80" height="250" rx="3" fill="#323232" stroke="#34495E" stroke-width="1.5" /><rect x="42" y="195.0" width="76" height="123.0" rx="2" fill="#0096FF" /><line x1="40" y1="95.0" x2="120" y2="95.0" stroke="#E74C3C" stroke-width="2" stroke-dasharray="3,2" /><rect x="61.0" y="186.5" width="38.0" height="16.0" rx="3" fill="#0A1118" fill-opacity="0.88" stroke="#334155" stroke-width="0.5" /><text x="80.0" y="199.0" fill="#FFFFFF" font-size="10" font-weight="bold" text-anchor="middle">50.0</text></g>
  <g id="tank1_level_pv" filter="url(#elementShadow)"><text x="30" y="326" fill="#A0AAB2" font-size="11" font-weight="600">PV Level</text><rect x="30" y="330" width="100" height="35" rx="4" fill="#282828" stroke="#4E5D6C" stroke-width="1.5" /><text x="120" y="351.5" fill="#00FFFF" font-size="13" font-family="Courier, monospace" font-weight="bold" text-anchor="end">0.0 %</text></g>
  <g id="level_sp_entry" filter="url(#elementShadow)"><text x="150" y="326" fill="#A0AAB2" font-size="11" font-weight="600">SP Level</text><rect x="150" y="330" width="100" height="35" rx="4" fill="#323246" stroke="#4E5D6C" stroke-width="1.5" /><text x="240" y="351.5" fill="#FFFFFF" font-size="13" font-family="Courier, monospace" font-weight="bold" text-anchor="end">0.0 %</text></g>
  <g id="pump1_start_stop" filter="url(#elementShadow)"><rect x="280" y="70" width="130" height="50" rx="6" fill="#B42828" stroke="#FFFFFF" stroke-width="1.5" /><rect x="280" y="70" width="130" height="50" rx="6" fill="url(#btnBevel)" /><text x="345.0" y="99.0" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">PUMP STOPPED</text></g>
  <g id="pump1_run_lamp"><circle cx="455.0" cy="95.0" r="25.0" fill="#323232" stroke="#FFFFFF" stroke-width="1.5"  /><text x="488" y="99.0" fill="#E0E1DD" font-size="12" font-weight="500">Run Status</text></g>
  <g id="high_alarm_lamp"><circle cx="175.0" cy="95.0" r="25.0" fill="#282828" stroke="#FFFFFF" stroke-width="1.5"  /><text x="208" y="99.0" fill="#E0E1DD" font-size="12" font-weight="500">High Alarm</text></g>
  <g id="valve_out_aq" filter="url(#elementShadow)"><text x="280" y="136" fill="#A0AAB2" font-size="11" font-weight="600">Valve Output (%AQ1)</text><rect x="280" y="140" width="130" height="35" rx="4" fill="#1E293B" stroke="#4E5D6C" stroke-width="1.5" /><text x="400" y="161.5" fill="#00FFFF" font-size="13" font-family="Courier, monospace" font-weight="bold" text-anchor="end">0 mA</text></g>
  <g id="main_trend_chart" filter="url(#elementShadow)"><rect x="280" y="190" width="500" height="220" rx="5" fill="#1E293B" stroke="#34495E" stroke-width="1.5" /><text x="290" y="206" fill="#CBD5E1" font-size="11" font-weight="bold">Process Trends</text><line x1="290" y1="261.25" x2="770" y2="261.25" stroke="#334155" stroke-width="0.8" stroke-dasharray="2,2" /><line x1="290" y1="307.5" x2="770" y2="307.5" stroke="#334155" stroke-width="0.8" stroke-dasharray="2,2" /><line x1="290" y1="353.75" x2="770" y2="353.75" stroke="#334155" stroke-width="0.8" stroke-dasharray="2,2" /><polyline points="290.0,307.5 338.0,278.1 386.0,255.1 434.0,243.5 482.0,245.9 530.0,261.7 578.0,287.5 626.0,317.6 674.0,345.6 722.0,365.2 770.0,372.2" fill="none" stroke="#00B4FF" stroke-width="2" /><text x="300" y="406" fill="#00B4FF" font-size="9" font-weight="600">%AI1</text><polyline points="290.0,253.0 338.0,243.1 386.0,247.2 434.0,264.4 482.0,291.1 530.0,321.3 578.0,348.5 626.0,366.8 674.0,372.1 722.0,363.4 770.0,342.5" fill="none" stroke="#FFA500" stroke-width="2" /><text x="390" y="406" fill="#FFA500" font-size="9" font-weight="600">%R100</text></g>
</svg>