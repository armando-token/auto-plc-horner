    <line x1="309.2" y1="326.6" x2="317.2" y2="326.6" stroke="#3B82F6" stroke-width="1.5" />
    <line x1="313.2" y1="322.6" x2="313.2" y2="330.6" stroke="#3B82F6" stroke-width="1.5" />
