    <text x="75" y="52" font-family="Segoe UI, monospace" font-size="16" font-weight="700" fill="#FFFFFF">CSCAPE HMI: CONVEX HULL MULTI-CLUSTER SPATIAL ENCLOSURE</text>
    <text x="750" y="52" font-family="Segoe UI, monospace" font-size="12" fill="#94A3B8">Points: <tspan fill="#FFFFFF" font-weight="700">25</tspan> | Clusters: <tspan fill="#FFFFFF" font-weight="700">3</tspan> | Outliers: <tspan fill="#EF4444" font-weight="700">1</tspan></text>
  </g>

