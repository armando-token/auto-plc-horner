    <polygon points="561.7,352.9 644.4,297.8 673.9,342.0 696.8,387.8 683.1,456.0 587.5,456.0" fill="#10B981" fill-opacity="0.08" stroke="#10B981" stroke-width="1.2" stroke-dasharray="6,4" stroke-opacity="0.4" />
