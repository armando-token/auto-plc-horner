    <rect x="50" y="700" width="1100" height="35" rx="5" fill="#0B0F19" stroke="#EF4444" stroke-width="1.5" />
    <text x="600.0" y="722" font-family="Segoe UI, monospace" font-size="12" font-weight="700" text-anchor="middle" fill="#EF4444">CRITICAL: 1 PROCESS OUTLIER(S) DETECTED - CHECK SYSTEM COILS %M379 / %M148</text>
