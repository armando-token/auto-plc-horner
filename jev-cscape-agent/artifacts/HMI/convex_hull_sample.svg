    <circle cx="195.0" cy="290.0" r="4.5" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1.2" />
    <circle cx="260.0" cy="290.0" r="4.5" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1.2" />
    <circle cx="225.0" cy="240.0" r="4.5" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1.2" />
    <circle cx="999.0" cy="999.0" r="6.5" fill="#EF4444" stroke="#FFFFFF" stroke-width="1.2" filter="url(#glow-alarm)" />
    <circle cx="999.0" cy="999.0" r="11" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="2,2" />
