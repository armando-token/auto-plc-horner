<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <defs>
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="glow-alarm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- SCADA Dark Theme Backdrop -->
  <rect width="1200" height="750" fill="#0F172A" />

  <!-- Coordinate Grid Mesh -->
  <g id="grid-mesh" stroke="#1E293B" stroke-width="1.0" stroke-dasharray="4,4">
    <line x1="100" y1="80" x2="100" y2="690" />
    <line x1="200" y1="80" x2="200" y2="690" />
    <line x1="300" y1="80" x2="300" y2="690" />
    <line x1="400" y1="80" x2="400" y2="690" />
    <line x1="500" y1="80" x2="500" y2="690" />
    <line x1="600" y1="80" x2="600" y2="690" />
    <line x1="700" y1="80" x2="700" y2="690" />
    <line x1="800" y1="80" x2="800" y2="690" />
    <line x1="900" y1="80" x2="900" y2="690" />
    <line x1="1000" y1="80" x2="1000" y2="690" />
    <line x1="1100" y1="80" x2="1100" y2="690" />
    <line x1="60" y1="120" x2="1140" y2="120" />
    <line x1="60" y1="200" x2="1140" y2="200" />
    <line x1="60" y1="280" x2="1140" y2="280" />
    <line x1="60" y1="360" x2="1140" y2="360" />
    <line x1="60" y1="440" x2="1140" y2="440" />
    <line x1="60" y1="520" x2="1140" y2="520" />
    <line x1="60" y1="600" x2="1140" y2="600" />
    <line x1="60" y1="680" x2="1140" y2="680" />
