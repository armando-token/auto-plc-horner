  <g id="bar_tank1_level" filter="url(#elementShadow)"><rect x="80" y="80" width="60" height="240" rx="3" fill="#323232" stroke="#34495E" stroke-width="1.5" /><rect x="82" y="283.625" width="56" height="34.375" rx="2" fill="#0096FF" /><rect x="91.0" y="191.5" width="38.0" height="16.0" rx="3" fill="#0A1118" fill-opacity="0.88" stroke="#334155" stroke-width="0.5" /><text x="110.0" y="204.0" fill="#FFFFFF" font-size="10" font-weight="bold" text-anchor="middle">15.2</text></g>
  <g id="bar_tank2_level" filter="url(#elementShadow)"><rect x="240" y="80" width="60" height="240" rx="3" fill="#323232" stroke="#34495E" stroke-width="1.5" /><rect x="242" y="280.925" width="56" height="37.075" rx="2" fill="#0096FF" /><rect x="251.0" y="191.5" width="38.0" height="16.0" rx="3" fill="#0A1118" fill-opacity="0.88" stroke="#334155" stroke-width="0.5" /><text x="270.0" y="204.0" fill="#FFFFFF" font-size="10" font-weight="bold" text-anchor="middle">16.3</text></g>
  <g id="num_t1_level" filter="url(#elementShadow)"><rect x="80" y="330" width="60" height="28" rx="4" fill="#1E293B" stroke="#4E5D6C" stroke-width="1.5" /><text x="130" y="348.0" fill="#00FFFF" font-size="13" font-family="Courier, monospace" font-weight="bold" text-anchor="end">4850 %</text></g>
  <g id="num_t2_level" filter="url(#elementShadow)"><rect x="240" y="330" width="60" height="28" rx="4" fill="#1E293B" stroke="#4E5D6C" stroke-width="1.5" /><text x="290" y="348.0" fill="#00FFFF" font-size="13" font-family="Courier, monospace" font-weight="bold" text-anchor="end">5210 %</text></g>
  <g id="lamp_p101_running"><circle cx="440.0" cy="120.0" r="20.0" fill="#00E676" stroke="#FFFFFF" stroke-width="1.5" filter="url(#lampGlow)" /><text x="468" y="124.0" fill="#E0E1DD" font-size="12" font-weight="500">PUMP 101</text></g>
  <g id="lamp_system_fault"><circle cx="440.0" cy="190.0" r="20.0" fill="#282828" stroke="#FFFFFF" stroke-width="1.5"  /><text x="468" y="194.0" fill="#E0E1DD" font-size="12" font-weight="500">TRIP / FAULT</text></g>
  <g id="btn_start_sim" filter="url(#elementShadow)"><rect x="520" y="100" width="100" height="40" rx="6" fill="#00C800" stroke="#FFFFFF" stroke-width="1.5" /><rect x="520" y="100" width="100" height="40" rx="6" fill="url(#btnBevel)" /><text x="570.0" y="124.0" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">ON</text></g>
  <g id="btn_stop_sim" filter="url(#elementShadow)"><rect x="640" y="100" width="100" height="40" rx="6" fill="#00C800" stroke="#FFFFFF" stroke-width="1.5" /><rect x="640" y="100" width="100" height="40" rx="6" fill="url(#btnBevel)" /><text x="690.0" y="124.0" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">ON</text></g>
  <g id="trend_cascade_levels" filter="url(#elementShadow)"><rect x="380" y="220" width="380" height="180" rx="5" fill="#1E293B" stroke="#34495E" stroke-width="1.5" /><line x1="390" y1="281.25" x2="750" y2="281.25" stroke="#334155" stroke-width="0.8" stroke-dasharray="2,2" /><line x1="390" y1="317.5" x2="750" y2="317.5" stroke="#334155" stroke-width="0.8" stroke-dasharray="2,2" /><line x1="390" y1="353.75" x2="750" y2="353.75" stroke="#334155" stroke-width="0.8" stroke-dasharray="2,2" /><polyline points="390.0,317.5 426.0,294.5 462.0,276.4 498.0,267.4 534.0,269.2 570.0,281.6 606.0,301.8 642.0,325.4 678.0,347.3 714.0,362.7 750.0,368.2" fill="none" stroke="#00E5FF" stroke-width="2" /><text x="400" y="396" fill="#00E5FF" font-size="9" font-weight="600">%AI1</text><polyline points="390.0,274.8 426.0,267.0 462.0,270.2 498.0,283.7 534.0,304.6 570.0,328.3 606.0,349.6 642.0,364.0 678.0,368.2 714.0,361.3 750.0,344.9" fill="none" stroke="#00E5FF" stroke-width="2" /><text x="490" y="396" fill="#00E5FF" font-size="9" font-weight="600">%AI2</text></g>
</svg>