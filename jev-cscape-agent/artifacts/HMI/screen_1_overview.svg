    <line x1="400" y1="0" x2="400" y2="480" />
    <line x1="440" y1="0" x2="440" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="520" y1="0" x2="520" y2="480" />
    <line x1="560" y1="0" x2="560" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
    <line x1="680" y1="0" x2="680" y2="480" />
    <line x1="720" y1="0" x2="720" y2="480" />
    <line x1="760" y1="0" x2="760" y2="480" />
    <line x1="0" y1="40" x2="800" y2="40" />
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="280" x2="800" y2="280" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="440" x2="800" y2="440" />
  </g>
  <!-- Screen Title Header -->
  <rect x="0" y="0" width="800" height="40" fill="url(#headerGrad)" />
  <line x1="0" y1="40" x2="800" y2="40" stroke="#415A77" stroke-width="1.5" />
  <text x="20" y="25" fill="#E0E1DD" font-size="16" font-weight="bold">Main Overview</text>
  <text x="780" y="25" fill="#778DA9" font-size="12" text-anchor="end">Screen ID: 1 | Res: 800x480</text>
  <!-- Screen Graphical Elements -->
