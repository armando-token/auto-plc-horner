    <circle cx="421.8" cy="340.0" r="9.0" fill="#38BDF8" stroke="#0F172A" stroke-width="1.5" />
    <path d="M 307.8 333.0 Q 335.5 315.5 363.2 310.0" fill="none" stroke="#38BDF8" stroke-width="4.0" stroke-linecap="round" />
    <path d="M 396.8 310.0 Q 424.5 315.5 452.2 333.0" fill="none" stroke="#38BDF8" stroke-width="4.0" stroke-linecap="round" />
