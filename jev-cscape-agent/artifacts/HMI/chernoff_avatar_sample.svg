<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>
    <filter id="glow-alarm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#0284C7" flood-opacity="0.8" />
    </filter>
    <filter id="badge-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg-grad)" />
  <!-- Header Bar -->
  <g id="header-group">
    <rect x="20" y="15" width="1160" height="55" rx="6" fill="#0B0F19" fill-opacity="0.95" stroke="#334155" stroke-width="1.2" />
    <text x="40" y="42" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#F8FAFC">CRITICAL PROCESS ANOMALY AVATAR (CHERNOFF MULTI-DIMENSIONAL GROUNDING)</text>
    <text x="40" y="58" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8">CSCAPE HMI GATE G9 / G2 LIVE SCREEN ENGINE - IEC 61131-3 PURE ST SYNCHRONIZATION</text>
  </g>
