    <text x="820.0" y="36.0" class="hud-label">MAX THERMAL</text>
    <text x="820.0" y="56.0" class="hud-val" fill="#EF4444">98.5 °C</text>
    <text x="930.0" y="36.0" class="hud-label">OVERLOAD ALARM</text>
    <text x="930.0" y="56.0" class="hud-val" fill="#EF4444">ALARM TRIP</text>
