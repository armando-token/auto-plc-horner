<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="750" viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" version="1.1">
  <defs>
    <filter id="anomaly-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="hud-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.94"/>
    </linearGradient>
    <style type="text/css">
      .hud-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 13px; font-weight: bold; fill: #F8FAFC; }
      .hud-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 500; fill: #94A3B8; text-transform: uppercase; }
      .hud-val { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 12px; font-weight: 700; fill: #38BDF8; }
      .unit-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #E2E8F0; }
      .sub-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; font-weight: 600; fill: #94A3B8; }
      .leaf-id { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 11px; font-weight: 700; fill: #F8FAFC; }
      .leaf-meta { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 9px; font-weight: 600; fill: #E2E8F0; }
    </style>
  </defs>
  <rect width="1200" height="750" fill="#0F172A"/>
  <!-- DIAGNOSTIC HUD HEADER BANNER -->
  <g id="diagnostic-hud">
    <rect x="20.0" y="12.0" width="1160.0" height="64.0" rx="6" ry="6" fill="url(#hud-bg)" stroke="#334155" stroke-width="1.5"/>
    <text x="36.0" y="36.0" class="hud-title">CSCAPE SQUARIFIED TREEMAP // RESOURCE &amp; THERMAL ALLOCATION ENGINE</text>
    <rect x="36.0" y="46.0" width="112" height="18" rx="3" fill="#047857" fill-opacity="0.3" stroke="#10B981" stroke-width="1"/>
    <text x="42.0" y="59.0" font-family="monospace" font-size="9" font-weight="700" fill="#34D399">ACTIVE | OPTIMAL</text>
    <text x="380.0" y="36.0" class="hud-label">TOTAL RESOURCE</text>
    <text x="380.0" y="56.0" class="hud-val" fill="#38BDF8">1,640.0 kW</text>
    <text x="490.0" y="36.0" class="hud-label">LEAF NODES</text>
    <text x="490.0" y="56.0" class="hud-val" fill="#F8FAFC">16</text>
    <text x="600.0" y="36.0" class="hud-label">MEAN ASPECT</text>
    <text x="600.0" y="56.0" class="hud-val" fill="#34D399">1.65</text>
    <text x="710.0" y="36.0" class="hud-label">PEAK CONSUMER</text>
