<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" font-family="Segoe UI, Arial, sans-serif" text-rendering="geometricPrecision" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B263B" />
      <stop offset="100%" stop-color="#0D1B2A" />
    </linearGradient>
    <linearGradient id="btnBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3" />
    </linearGradient>
    <filter id="lampGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="elementShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feFlood flood-color="#000000" flood-opacity="0.35" />
      <feComposite in2="offsetblur" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Canvas Background -->
  <rect width="800" height="480" fill="#121826" />
  <!-- Alignment Grid -->
  <g stroke="#2C3E50" stroke-width="0.5" stroke-opacity="0.25">
    <line x1="40" y1="0" x2="40" y2="480" />
    <line x1="80" y1="0" x2="80" y2="480" />
    <line x1="120" y1="0" x2="120" y2="480" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="200" y1="0" x2="200" y2="480" />
    <line x1="240" y1="0" x2="240" y2="480" />
    <line x1="280" y1="0" x2="280" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="360" y1="0" x2="360" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" />
    <line x1="440" y1="0" x2="440" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="520" y1="0" x2="520" y2="480" />
    <line x1="560" y1="0" x2="560" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
    <line x1="680" y1="0" x2="680" y2="480" />
    <line x1="720" y1="0" x2="720" y2="480" />
    <line x1="760" y1="0" x2="760" y2="480" />
    <line x1="0" y1="40" x2="800" y2="40" />
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="280" x2="800" y2="280" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="440" x2="800" y2="440" />
  </g>
  <!-- Screen Title Header -->
  <rect x="0" y="0" width="800" height="40" fill="url(#headerGrad)" />
  <line x1="0" y1="40" x2="800" y2="40" stroke="#415A77" stroke-width="1.5" />
  <text x="20" y="25" fill="#E0E1DD" font-size="16" font-weight="bold">Recipe Management</text>
  <text x="780" y="25" fill="#778DA9" font-size="12" text-anchor="end">Screen ID: 6 | Res: 800x480</text>
  <!-- Screen Graphical Elements -->
  <g id="alm_header_6" filter="url(#elementShadow)"><rect x="20" y="46" width="760" height="26" rx="4" fill="#2C3E50" stroke="#E74C3C" stroke-width="0.5" /><circle cx="38" cy="59.0" r="6" fill="#2ECC71" /><text x="52" y="63.0" fill="#FFFFFF" font-size="11" font-weight="bold">SYSTEM NORMAL - NO ACTIVE ALARMS</text></g>
  <g id="num_param_6_1" filter="url(#elementShadow)"><text x="100" y="96" fill="#A0AAB2" font-size="11" font-weight="600">Parameter 1</text><rect x="100" y="100" width="120" height="32" rx="4" fill="#1E293B" stroke="#4E5D6C" stroke-width="1.5" /><text x="210" y="120.0" fill="#00FFFF" font-size="13" font-family="Courier, monospace" font-weight="bold" text-anchor="end">1250</text></g>
  <g id="num_param_6_2" filter="url(#elementShadow)"><text x="100" y="156" fill="#A0AAB2" font-size="11" font-weight="600">Parameter 2</text><rect x="100" y="160" width="120" height="32" rx="4" fill="#1E293B" stroke="#4E5D6C" stroke-width="1.5" /><text x="210" y="180.0" fill="#00FFFF" font-size="13" font-family="Courier, monospace" font-weight="bold" text-anchor="end">450</text></g>
  <g id="lamp_stat_6"><circle cx="320.0" cy="120.0" r="20.0" fill="#00FF00" stroke="#FFFFFF" stroke-width="1.5" filter="url(#lampGlow)" /><text x="348" y="124.0" fill="#E0E1DD" font-size="12" font-weight="500">Ready Status</text></g>
  <g id="btn_apply_6" filter="url(#elementShadow)"><rect x="300" y="160" width="120" height="38" rx="6" fill="#505050" stroke="#FFFFFF" stroke-width="1.5" /><rect x="300" y="160" width="120" height="38" rx="6" fill="url(#btnBevel)" /><text x="360.0" y="183.0" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">OFF</text></g>
</svg>