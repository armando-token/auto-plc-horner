      <rect id="card-bar-col-4" x="650.0" y="230.9" width="40.0" height="109.1" rx="3" fill="#2ECC71" stroke="#1E293B" stroke-width="1.0"/>
      <text x="670.0" y="224.9" fill="#F8FAFC" font-family="Segoe UI, monospace" font-size="11" font-weight="700" text-anchor="middle">30</text>
