  <!-- 4. Horner OCS Memory Space Integration HUD (%R1020..%R1027, %M238..%M239) -->
  <g id="register-space-hud">
    <rect x="980" y="95" width="190" height="625" rx="6" fill="#0B0F19" fill-opacity="0.95" stroke="#334155" stroke-width="1.5"/>
    <text x="1075" y="125" fill="#F8FAFC" font-family="Segoe UI, monospace" font-size="12" font-weight="700" text-anchor="middle">HORNER OCS REGISTERS</text>
    <line x1="995" y1="135" x2="1155" y2="135" stroke="#334155" stroke-width="1"/>
    <text x="995" y="160" fill="#94A3B8" font-family="Segoe UI, monospace" font-size="11">%R1020 Active Sets:</text>
    <text x="1155" y="160" fill="#38BDF8" font-family="Segoe UI, monospace" font-size="11" font-weight="700" text-anchor="end">5</text>
    <text x="995" y="190" fill="#94A3B8" font-family="Segoe UI, monospace" font-size="11">%R1021 Cardinality:</text>
    <text x="1155" y="190" fill="#38BDF8" font-family="Segoe UI, monospace" font-size="11" font-weight="700" text-anchor="end">55</text>
    <text x="995" y="220" fill="#94A3B8" font-family="Segoe UI, monospace" font-size="11">%R1022 Combinations:</text>
    <text x="1155" y="220" fill="#38BDF8" font-family="Segoe UI, monospace" font-size="11" font-weight="700" text-anchor="end">8</text>
    <text x="995" y="250" fill="#94A3B8" font-family="Segoe UI, monospace" font-size="11">%R1023 Degree:</text>
    <text x="1155" y="250" fill="#38BDF8" font-family="Segoe UI, monospace" font-size="11" font-weight="700" text-anchor="end">2</text>
    <text x="995" y="280" fill="#94A3B8" font-family="Segoe UI, monospace" font-size="11">%R1024 Incidents:</text>
    <text x="1155" y="280" fill="#38BDF8" font-family="Segoe UI, monospace" font-size="11" font-weight="700" text-anchor="end">240</text>
    <text x="995" y="310" fill="#94A3B8" font-family="Segoe UI, monospace" font-size="11">%R1025 Severity:</text>
    <text x="1155" y="310" fill="#38BDF8" font-family="Segoe UI, monospace" font-size="11" font-weight="700" text-anchor="end">65.0%</text>
    <text x="995" y="340" fill="#94A3B8" font-family="Segoe UI, monospace" font-size="11">%R1026 Active Col:</text>
    <text x="1155" y="340" fill="#38BDF8" font-family="Segoe UI, monospace" font-size="11" font-weight="700" text-anchor="end">#0</text>
    <text x="995" y="370" fill="#94A3B8" font-family="Segoe UI, monospace" font-size="11">%R1027 Diag Status:</text>
    <text x="1155" y="370" fill="#38BDF8" font-family="Segoe UI, monospace" font-size="11" font-weight="700" text-anchor="end">0x0000</text>
    <line x1="995" y1="390" x2="1155" y2="390" stroke="#334155" stroke-width="1"/>
    <text x="995" y="420" fill="#94A3B8" font-family="Segoe UI, monospace" font-size="11">%M238 Cascade Trip:</text>
    <text x="1155" y="420" fill="#2ECC71" font-family="Segoe UI, monospace" font-size="11" font-weight="700" text-anchor="end">FALSE</text>
