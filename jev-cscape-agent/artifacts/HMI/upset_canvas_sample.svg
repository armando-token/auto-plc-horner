<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1200" height="750" viewBox="0 0 1200 750">
  <defs>
    <filter id="focus-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.0" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 1. Dark Theme Industrial Viewport Backing (#0F172A / #1E1E1E) -->
  <rect id="canvas-backdrop" width="1200" height="750" fill="#0F172A"/>

  <!-- 2. SCADA Master Header HUD Banner -->
  <g id="diagnostic-hud">
    <rect x="30" y="15" width="1140" height="65" rx="6" fill="#0B0F19" fill-opacity="0.95" stroke="#334155" stroke-width="1.5"/>
    <text x="45" y="42" fill="#F8FAFC" font-family="Segoe UI, monospace" font-size="16" font-weight="700" letter-spacing="0.5">HORNER OCS HMI - UPSET MATRIX MULTI-SET INTERLOCKING CANVAS</text>
    <text x="45" y="62" fill="#94A3B8" font-family="Segoe UI, monospace" font-size="11">WORK PACKAGE W141 (GATE G9 / G2)  |  MULTI-SET INTERSECTION &amp; ALARM CASCADE ANALYSIS  |  ANSI/ISA-101 ERGONOMICS</text>
    <rect id="master-status-banner" x="910" y="24" width="245" height="46" rx="4" fill="#2ECC71" fill-opacity="0.20" stroke="#2ECC71" stroke-width="1.5"/>
    <text x="1033" y="45" fill="#F8FAFC" font-family="Segoe UI, monospace" font-size="12" font-weight="700" text-anchor="middle">ALL INTERLOCKS NOMINAL</text>
    <text x="1033" y="61" fill="#2ECC71" font-family="Segoe UI, monospace" font-size="10" font-weight="600" text-anchor="middle">DIAGNOSTIC STATUS: 0x0000 OK</text>
  </g>

  <!-- 3. UpSet Matrix Main Layout Container -->
  <g id="upset-matrix-grid">
    <!-- 3a. Primary Set Size Horizontal Bar Chart -->
    <g id="set-size-bars">
      <text x="30" y="375" fill="#94A3B8" font-family="Segoe UI, monospace" font-size="11" font-weight="700">PRIMARY SET SIZE</text>
      <text x="145" y="404.0" fill="#F8FAFC" font-family="Segoe UI, monospace" font-size="12" font-weight="600" text-anchor="end">Emergency Stop</text>
      <rect x="155" y="390.0" width="81.4" height="20" rx="3" fill="#E74C3C" fill-opacity="0.85"/>
      <text x="246.4" y="404.0" fill="#94A3B8" font-family="Segoe UI, monospace" font-size="11">95</text>
      <text x="145" y="462.0" fill="#F8FAFC" font-family="Segoe UI, monospace" font-size="12" font-weight="600" text-anchor="end">Over-Pressure</text>
      <rect x="155" y="448.0" width="120.0" height="20" rx="3" fill="#F39C12" fill-opacity="0.85"/>
      <text x="285.0" y="462.0" fill="#94A3B8" font-family="Segoe UI, monospace" font-size="11">140</text>
      <text x="145" y="520.0" fill="#F8FAFC" font-family="Segoe UI, monospace" font-size="12" font-weight="600" text-anchor="end">Over-Temperature</text>
      <rect x="155" y="506.0" width="102.9" height="20" rx="3" fill="#E67E22" fill-opacity="0.85"/>
      <text x="267.9" y="520.0" fill="#94A3B8" font-family="Segoe UI, monospace" font-size="11">120</text>
      <text x="145" y="578.0" fill="#F8FAFC" font-family="Segoe UI, monospace" font-size="12" font-weight="600" text-anchor="end">Vibration Trip</text>
      <rect x="155" y="564.0" width="68.6" height="20" rx="3" fill="#9B59B6" fill-opacity="0.85"/>
      <text x="233.6" y="578.0" fill="#94A3B8" font-family="Segoe UI, monospace" font-size="11">80</text>
      <text x="145" y="636.0" fill="#F8FAFC" font-family="Segoe UI, monospace" font-size="12" font-weight="600" text-anchor="end">Gas Leak</text>
      <rect x="155" y="622.0" width="42.9" height="20" rx="3" fill="#1ABC9C" fill-opacity="0.85"/>
      <text x="207.9" y="636.0" fill="#94A3B8" font-family="Segoe UI, monospace" font-size="11">50</text>
    </g>

