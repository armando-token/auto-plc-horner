    <!-- 3d. Active Combination Focus Highlight Column -->
    <rect id="active-combination-focus" x="310.0" y="100" width="80.0" height="575" rx="6" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="6 3"/>
